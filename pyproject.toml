[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certifying-robust-pricing-mckp"
version = "4.0.0"
description = "Certified solvers for finite-menu Gamma-robust pricing and the robust multiple-choice knapsack problem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Zi Yuan Eric Shao", email = "ershao@student.ethz.ch"}
]
keywords = ["robust optimization", "multiple-choice knapsack", "pricing", "certificates", "branch-and-bound"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "numba>=0.59"]

[project.optional-dependencies]
milp = [
  "highspy>=1.7",
]
scip = [
  "pyscipopt>=5.0",
]
study = [
  "highspy>=1.7",
  "pyscipopt>=5.0",
  "matplotlib>=3.8",
]
experiments = [
  "matplotlib>=3.8",
  "tqdm>=4.66",
]
validation = [
  "scipy>=1.12",
]
dev = [
  "pytest>=8",
  "build>=1.2",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/eric939/certifying-robust-pricing-mckp"
Changelog = "https://github.com/eric939/certifying-robust-pricing-mckp/blob/main/CHANGELOG.md"
Repository = "https://github.com/eric939/certifying-robust-pricing-mckp"
Issues = "https://github.com/eric939/certifying-robust-pricing-mckp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
