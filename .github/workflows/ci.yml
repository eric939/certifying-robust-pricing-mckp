name: tests and reproducibility

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the library with all extras
        run: uv sync --frozen --python ${{ matrix.python }} --all-extras
      - name: Tests
        run: make test PYTHON=.venv/bin/python
      - name: Examples
        run: make examples PYTHON=.venv/bin/python

  evidence:
    # The campaigns ran on macOS arm64. NumPy's exp, power and normal sampling
    # differ in the last bits between platforms, so bit-for-bit regeneration of
    # the seeded portfolios (verify_evidence.py --instances) is checked there.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # verify-archive checks out tag v3.1.1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Campaign environment
        run: make study-env
      - name: Revised paper evidence (integrity, design, rebuilt reports, portfolios, re-runs)
        run: make verify-evidence-full PYTHON=.venv-study/bin/python
      - name: v3 evidence against tag v3.1.1
        run: make verify-archive PYTHON=.venv-study/bin/python

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - name: Build and check the distributions
        run: |
          uv sync --frozen --python 3.12 --extra dev
          make build PYTHON=.venv/bin/python
